<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">One-centimeter flip rate by hip size</title>
  <desc id="figure-desc">Bar chart of the ±1 cm single-field flip rate by hip circumference. Rates are 30.9% at 80 and 90 cm, 27.5% at 100 cm, and 19.1% from 110 to 140 cm. Each bar represents 95,694 synthetic tested points; the overall rate is 23.6%. This is not a population estimate.</desc>
